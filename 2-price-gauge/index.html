<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCD Display</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .lcd-container {
            background-color: #222;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }
        
        .lcd-display {
            background-color: #1e1e2e;
            border: 2px solid #333;
            padding: 10px 15px;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 48px;
            color: #89b4fa;
            text-shadow: 0 0 3px #b4befe;
            min-width: 300px;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>
    <div class="lcd-container">
        <div class="lcd-display" id="lcd-number">$0000.00</div>
    </div>
    <script type="module" src="./index.js"></script>
</body>
</html>
